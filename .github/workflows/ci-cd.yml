name: CI/CD for Config-Repo

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Set up JDK 23
      - name: Set up JDK 23
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '23'

      # Set Gradle permissions to make it executable
      - name: Set Gradle Permissions
        run: chmod +x ./gradlew

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to Docker Hub securely using GitHub Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: kakarot987
          password: dckr_pat_2BcbUEIug6MOdFXfqhdM67DzpBE

      # Build the Docker image
      - name: Build Docker image
        run: |
          docker build -t myapp:${{ github.sha }} .

      # Build and Test using Gradle
      - name: Build and Test
        run: ./gradlew clean build

      # Docker Build and Push to Docker Hub
      - name: Docker Build and Push
        run: |
          docker tag myapp:${{ github.sha }} kakarot987/myapp:${{ github.sha }}
          docker push kakarot987/myapp:${{ github.sha }}

