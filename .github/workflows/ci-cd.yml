name: CI/CD for Config-Repo

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 23
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '23'

      - name: Set Gradle Permissions
        run: chmod +x ./gradlew

      - name: Docker Login
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: kakarot987
          password: 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

      - name: Build and Test
        run: ./gradlew clean build

      - name: Docker Build and Push
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./spring_cloud/config-server/Dockerfile
          push: true
          tags: ghcr.io/kakarot987/config-repo:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to Kubernetes
        uses: azure/k8s-deploy@v3
        with:
          manifests: |
            ./k8s/deployment.yaml
            ./k8s/service.yaml
