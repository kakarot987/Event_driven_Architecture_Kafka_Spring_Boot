name: CI/CD for Config-Repo

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 23
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '23'

      - name: Set Gradle Permissions
        run: chmod +x ./gradlew

      - name: Build the project with Gradle
        run: ./gradlew clean build

      # Use Docker Compose to build and run containers for testing
      - name: Set up Docker Compose
        run: |
          sudo apt-get install docker-compose

      # Build and start the Docker Compose environment
      - name: Build and Start Docker Compose
        run: |
          docker-compose -f docker-compose.yml up -d --build

      # Shut down the containers after tests
      - name: Shut down Docker Compose
        run: docker-compose -f docker-compose.yml down

