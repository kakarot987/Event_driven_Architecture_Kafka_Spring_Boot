name: Deployment validation (no automatic apply)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/Deploy.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - name: Validate
        working-directory: terraform/local
        run: |
          terraform init -backend=false
          terraform validate
# Do not auto-apply demo Terraform on push; it does not deploy the complete application.
