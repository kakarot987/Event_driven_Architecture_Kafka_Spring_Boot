name: Continuous Build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --stacktrace
