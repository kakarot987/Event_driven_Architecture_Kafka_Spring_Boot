# application.properties

# Spring Boot application properties
spring.application.name=admin-panel
server.port=8081

# Eureka client configuration
eureka.client.service-url.default-zone=http://localhost:8761/eureka/

# Cloud Config client configuration
spring.cloud.config.failFast=true
spring.cloud.config.retry.initialInterval=3000
spring.cloud.config.retry.multiplier=1.3
spring.cloud.config.retry.maxInterval=10000
spring.cloud.config.retry.maxAttempts=20
spring.cloud.config.uri=http://${CONFIG_SERVER_USR}:${CONFIG_SERVER_PWD}@${app.config-server}:8888

# Profiles
spring.profiles.active=docker

