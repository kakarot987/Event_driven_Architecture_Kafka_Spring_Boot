# Spring Boot application properties
spring.application.name=auth-service
server.port=8080

# Eureka client configuration
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Cloud Config client configuration
spring.cloud.config.failFast=false
spring.cloud.config.retry.initialInterval=3000
spring.cloud.config.retry.multiplier=1.3
spring.cloud.config.retry.maxInterval=10000
spring.cloud.config.retry.maxAttempts=20
spring.config.import=optional:configserver:http://localhost:8888

# Profiles

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${AUTH_DB_URL:jdbc:mysql://localhost:3306/login}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.jwtExpirationMs=${JWT_EXPIRATION_MS:900000}

# SMTP is mandatory for password reset requests to existing verified emails.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.password-reset.from=${RESET_EMAIL_FROM:}
app.password-reset.base-url=${RESET_BASE_URL:}
