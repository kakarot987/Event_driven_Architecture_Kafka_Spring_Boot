services:
  # ============ Infrastructure ============
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - "./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    networks:
      - cloud-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - "grafana-data:/var/lib/grafana"
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - cloud-network

  vault:
    image: hashicorp/vault:latest
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "sh", "-c", "VAULT_ADDR=http://127.0.0.1:8200 vault status"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks:
      - cloud-network

  vault-seed:
    image: hashicorp/vault:latest
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
    entrypoint: >
      sh -c "
      vault secrets enable -path=secret kv-v2 || true;
      vault kv put secret/eureka-server EUREKA_USR=eureka_admin EUREKA_PWD=eureka_pass_local;
      vault kv put secret/auth-service DB_USERNAME=auth_user DB_PASSWORD=auth_pass_local JWT_SECRET=dev-only-secret-change-in-prod EUREKA_USR=eureka_admin EUREKA_PWD=eureka_pass_local;
      vault kv put secret/order-service DB_USERNAME=order_user DB_PASSWORD=order_pass_local EUREKA_USR=eureka_admin EUREKA_PWD=eureka_pass_local;
      vault kv put secret/payment-service DB_USERNAME=payment_user DB_PASSWORD=payment_pass_local EUREKA_USR=eureka_admin EUREKA_PWD=eureka_pass_local;
      vault kv put secret/inventory-service DB_USERNAME=inventory_user DB_PASSWORD=inventory_pass_local EUREKA_USR=eureka_admin EUREKA_PWD=eureka_pass_local;
      vault kv put secret/shipping-service DB_USERNAME=shipping_user DB_PASSWORD=shipping_pass_local EUREKA_USR=eureka_admin EUREKA_PWD=eureka_pass_local;
      vault kv put secret/notification-service DB_USERNAME=notification_user DB_PASSWORD=notification_pass_local EUREKA_USR=eureka_admin EUREKA_PWD=eureka_pass_local;
      echo 'Vault seeded.'
      "
    networks:
      - cloud-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(yellow|green)\"' || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks:
      - cloud-network

  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.10
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "5044:5044"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - cloud-network

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.10
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - cloud-network

  # ============ Databases ============
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: cloudarchitecturedb
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloud-network

  # ============ Message Broker ============
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    ports:
      - "9092:9092"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

    networks:
      - cloud-network

  # ============ Spring Cloud Components ============
  config-server:
    build:
      context: .
      dockerfile: ./spring_cloud/config-server/Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: vault
      VAULT_TOKEN: "root"
      MANAGEMENT_HEALTH_CONFIG_ENABLED: "false"
    depends_on:
      vault-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8888/actuator/health | grep -q 'UP' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cloud-network

  eureka-server:
    build:
      context: .
      dockerfile: ./spring_cloud/eureka-server/Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_USR: eureka_admin
      EUREKA_PWD: eureka_pass_local
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8761/actuator/health | grep -q 'UP' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloud-network

  gateway:
    build:
      context: .
      dockerfile: ./spring_cloud/gateway/Dockerfile
    container_name: gateway

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: gateway
      SERVER_PORT: 8080

      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka_admin:eureka_pass_local@eureka-server:8761/eureka/

    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    networks:
      - cloud-network

  # ============ Microservices ============
  authentication-authorization:
    build:
      context: .
      dockerfile: ./microservices/authentication-authorization/Dockerfile
    container_name: auth-service

    ports:
      - "8001:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: auth-service
      SERVER_PORT: 8080

      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cloudarchitecturedb
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: auth_pass_local

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka_admin:eureka_pass_local@eureka-server:8761/eureka/

    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q 'UP' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - cloud-network

  order-service:
    build:
      context: .
      dockerfile: ./microservices/order-service/Dockerfile
    container_name: order-service

    ports:
      - "8002:8081"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: order-service
      SERVER_PORT: 8081

      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/order_db
      SPRING_DATASOURCE_USERNAME: order_user
      SPRING_DATASOURCE_PASSWORD: order_pass_local

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka_admin:eureka_pass_local@eureka-server:8761/eureka/

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep -q 'UP' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - cloud-network

  payment-service:
    build:
      context: .
      dockerfile: ./microservices/payment-service/Dockerfile
    container_name: payment-service

    ports:
      - "8003:8082"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: payment-service
      SERVER_PORT: 8082

      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payment_db
      SPRING_DATASOURCE_USERNAME: payment_user
      SPRING_DATASOURCE_PASSWORD: payment_pass_local

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka_admin:eureka_pass_local@eureka-server:8761/eureka/

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health | grep -q 'UP' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - cloud-network

  inventory-service:
    build:
      context: .
      dockerfile: ./microservices/inventory-service/Dockerfile
    container_name: inventory-service

    ports:
      - "8004:8083"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: inventory-service
      SERVER_PORT: 8083

      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/inventory_db
      SPRING_DATASOURCE_USERNAME: inventory_user
      SPRING_DATASOURCE_PASSWORD: inventory_pass_local

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka_admin:eureka_pass_local@eureka-server:8761/eureka/

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health | grep -q 'UP' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - cloud-network

  shipping-service:
    build:
      context: .
      dockerfile: ./microservices/shipping-service/Dockerfile
    container_name: shipping-service

    ports:
      - "8005:8084"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: shipping-service
      SERVER_PORT: 8084

      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shipping_db
      SPRING_DATASOURCE_USERNAME: shipping_user
      SPRING_DATASOURCE_PASSWORD: shipping_pass_local

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka_admin:eureka_pass_local@eureka-server:8761/eureka/

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health | grep -q 'UP' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - cloud-network

  notification-service:
    build:
      context: .
      dockerfile: ./microservices/notification-service/Dockerfile
    container_name: notification-service

    ports:
      - "8006:8085"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: notification-service
      SERVER_PORT: 8085

      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/notification_db
      SPRING_DATASOURCE_USERNAME: notification_user
      SPRING_DATASOURCE_PASSWORD: notification_pass_local

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka_admin:eureka_pass_local@eureka-server:8761/eureka/

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health | grep -q 'UP' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - cloud-network

networks:
  cloud-network:
    driver: bridge

volumes:
  grafana-data:
  mysql-data: