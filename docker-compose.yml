version: '2.1'

services:
  authentication-authorization:
    build: microservices/authentication-authorization
    mem_limit: 1500m
    networks:
      - my-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_USR=${CONFIG_SERVER_USR}
      - CONFIG_SERVER_PWD=${CONFIG_SERVER_PWD}
    extra_hosts:
      localhost: 172.31.29.109
      mysql: 172.17.0.1
      mysql1: 172.19.0.1
      mysql2: 172.20.0.1
      mysql3: 172.18.0.1
      mysql4: 172.21.0.1

  admin-panel:
    build: microservices/admin-panel
    mem_limit: 1500m
    networks:
      - my-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_USR=${CONFIG_SERVER_USR}
      - CONFIG_SERVER_PWD=${CONFIG_SERVER_PWD}
    extra_hosts:
      localhost: 172.31.29.109
      mysql: 172.17.0.1
      mysql1: 172.19.0.1
      mysql2: 172.20.0.1
      mysql3: 172.18.0.1
      mysql4: 172.21.0.1

  eureka:
    build: spring_cloud/eureka-server
    mem_limit: 700m
    networks:
      - my-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_USR=${CONFIG_SERVER_USR}
      - CONFIG_SERVER_PWD=${CONFIG_SERVER_PWD}


  config-server:
    build: spring_cloud/config-server
    mem_limit: 700m
    networks:
      - my-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker,native
      - ENCRYPT_KEY=${CONFIG_SERVER_ENCRYPT_KEY}
      - SPRING_SECURITY_USER_NAME=${CONFIG_SERVER_USR}
      - SPRING_SECURITY_USER_PASSWORD=${CONFIG_SERVER_PWD}

networks:
  my-network:
    name: my-network