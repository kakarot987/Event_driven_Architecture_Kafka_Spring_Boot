apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-repo-deployment
  labels:
    app: config-repo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: config-repo
  template:
    metadata:
      labels:
        app: config-repo
    spec:
      containers:
        - name: config-repo
          image: ghcr.io/your-org/config-repo:latest
          ports:
            - containerPort: 8080
          env:
            - name: CONFIG_PATH
              value: "/configs"
