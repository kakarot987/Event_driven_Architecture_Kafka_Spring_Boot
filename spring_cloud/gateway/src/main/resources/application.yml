app.config-server: localhost

spring:
  application.name: gateway
  config:
    import: "optional:configserver:http://${CONFIG_SERVER_USR}:${CONFIG_SERVER_PWD}@config-server:8888"
  cloud:
    config:
      failFast: false
      retry:
        initialInterval: 3000
        multiplier: 1.3
        maxInterval: 10000
        maxAttempts: 20
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedHeaders: "*"
            allowedMethods:
              - GET
              - POST

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka_admin:eureka_pass_local@eureka-server:8761/eureka/
---
spring:
  config:
    activate:
      on-profile: docker
    import: "optional:configserver:http://${CONFIG_SERVER_USR}:${CONFIG_SERVER_PWD}@config-server:8888"
app:
  config-server: config-server
eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka_admin:eureka_pass_local@eureka-server:8761/eureka/