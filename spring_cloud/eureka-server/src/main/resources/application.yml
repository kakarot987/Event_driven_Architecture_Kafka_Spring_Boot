server:
  port: 8761

management:
  endpoint:
    health:
      show-details: "ALWAYS"
    prometheus:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"

spring:
  application:
    name: eureka-server
  profiles:
    active: docker
  security:
    user:
      name: ${EUREKA_USR}
      password: ${EUREKA_PWD}
  cloud:
    config:
      fail-fast: true
      retry:
        initial-interval: 3000
        multiplier: 1.3
        max-interval: 10000
        max-attempts: 20

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

---
spring:
  config:
    activate:
      on-profile: docker
    import: "configserver:http://config-server:8888"

---
spring:
  config:
    activate:
      on-profile: local
    import: "configserver:http://localhost:8888"