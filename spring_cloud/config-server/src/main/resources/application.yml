server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: docker

management.endpoint.health.show-details: "ALWAYS"
management.endpoints.web.exposure.include: "*"
management.endpoints.prometheus.enables: "true"

logging:
  level:
    root: info
  file:
    path: /var/log/config-repo

