server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: vault          # <-- was "docker", now points at Vault backend

management:
  endpoint:
    health:
      show-details: "ALWAYS"
  endpoints:
    web:
      exposure:
        include: "*"

---
spring:
  config:
    activate:
      on-profile: vault    # <-- renamed from "native"
  cloud:
    config:
      server:
        vault:
          host: vault       # <-- container service name, NOT 127.0.0.1 (see below)
          port: 8200
          scheme: http
          kv-version: 2
          authentication: TOKEN
          token: ${VAULT_TOKEN}